basePath: /api
definitions:
  dto.EmptyData:
    type: object
  dto.ErrorResponse:
    properties:
      data:
        type: object
      error:
        example: some error message
        type: string
      is_success:
        example: false
        type: boolean
    type: object
  dto.LoginUserRequest:
    properties:
      login:
        example: john_doe
        type: string
      password:
        example: securePass123
        type: string
    required:
    - login
    - password
    type: object
  dto.RegisterUserRequest:
    properties:
      display_name:
        example: John Doe
        maxLength: 20
        type: string
      login:
        example: john_doe
        maxLength: 20
        minLength: 3
        type: string
      password:
        example: securePass123
        maxLength: 63
        minLength: 8
        type: string
    required:
    - display_name
    - login
    - password
    type: object
  dto.SuccessEmptyResponse:
    properties:
      data:
        $ref: '#/definitions/dto.EmptyData'
      error:
        example: ""
        type: string
      is_success:
        example: true
        type: boolean
    type: object
  dto.SuccessTokenResponse:
    properties:
      data:
        $ref: '#/definitions/dto.TokenResponse'
      error:
        example: ""
        type: string
      is_success:
        example: true
        type: boolean
    type: object
  dto.SuccessUserAndTokenResponse:
    properties:
      data:
        $ref: '#/definitions/dto.UserAndTokenResponse'
      error:
        example: ""
        type: string
      is_success:
        example: true
        type: boolean
    type: object
  dto.SuccessUserResponse:
    properties:
      data:
        $ref: '#/definitions/dto.UserResponse'
      error:
        example: ""
        type: string
      is_success:
        example: true
        type: boolean
    type: object
  dto.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  dto.UserAndTokenResponse:
    properties:
      token:
        $ref: '#/definitions/dto.TokenResponse'
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.UserResponse:
    properties:
      created_at:
        example: "2025-12-15T09:00:00Z"
        type: string
      display_name:
        example: John Doe
        type: string
      id:
        example: 12345
        type: integer
      login:
        example: john_doe
        type: string
    type: object
info:
  contact: {}
  description: Simple chat backend API
  title: Trossage API
  version: "1.0"
paths:
  /auth/login:
    post:
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginUserRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessUserAndTokenResponse'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes current refresh token and ends session on this device
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessEmptyResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/logout-all:
    post:
      description: Revokes all refresh tokens and ends all user sessions
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessEmptyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout from all devices
      tags:
      - auth
  /auth/refresh:
    post:
      description: Generates new access and refresh tokens using valid refresh token
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessTokenResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterUserRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SuccessUserAndTokenResponse'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register user
      tags:
      - auth
  /users/me:
    get:
      description: Returns authenticated user profile information
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
